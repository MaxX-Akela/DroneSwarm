[network]
discovery_port = 9000
telemetry_port = 9001
tcp_port = 9010
bind_address = 0.0.0.0
drone_timeout = 5.0

[server]
log_dir = .

[web]
; swarm 3D visualization: http://<server-ip>:<port>/
port = 8765
; aruco map file drawn on it; the map sent with "Send > Aruco map..." replaces it until restart
aruco_map =

[paths]
; destinations on the drone for files sent from the Send menu
camera_calibration = /home/pi/catkin_ws/src/clover/clover/camera_info/fisheye_cam_320x240.yaml
aruco_map = /home/pi/catkin_ws/src/clover/aruco_pose/map/map.txt
launch_dir = /home/pi/catkin_ws/src/clover/clover/launch
