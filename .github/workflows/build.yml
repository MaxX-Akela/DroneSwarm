name: DroneSwarm Build

on:
  release:
    types: [ created ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DroneSwarm
        uses: actions/checkout@v4
        with:
          path: DroneSwarm

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static binfmt-support kpartx wget unzip zip

      - name: Run Build Script
        run: |
          sudo bash DroneSwarm/builder/build.sh
          sudo chown -R $USER:$USER images/
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}

      - name: Get Release Tag
        id: get_tag
        env:
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          RAW_NAME="${RELEASE_NAME:-$RELEASE_TAG}"
          # Release titles can contain spaces/slashes/etc.; make it filename-safe.
          SAFE_NAME=$(printf '%s' "$RAW_NAME" | tr -d '\\/:*?"<>|' | tr -s '[:space:]' '-' | sed -E 's/^-+|-+$//g')
          echo "TAG_NAME=$SAFE_NAME" >> $GITHUB_OUTPUT

      - name: Process and Zip Images
        run: |
          cd images
          TAG="${{ steps.get_tag.outputs.TAG_NAME }}"
          for img in *.img; do
            if [ -f "$img" ]; then
              NEW_NAME="${img%.*}-${TAG}.img"
              echo "Zipping $NEW_NAME..."
              zip -9 "${NEW_NAME%.*}.zip" "$img"

              rm "$img"
            fi
          done

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: images/*.zip
