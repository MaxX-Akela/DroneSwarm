# chrony config for the drone (client role).
#
# The show network is usually offline, so this points at the server acting
# as its own time authority (see server/chrony/chrony-server.conf) rather
# than a public NTP pool. Edit SERVER_IP for your setup, or push a new
# drone.ini with a different [network] server_ip and re-copy this file —
# there's no way to auto-discover the chrony source the way the swarm
# protocol discovers the command server, chrony needs a fixed address.
server 192.168.1.100 iburst minpoll 4 maxpoll 6

# Step the clock immediately if it's off by more than 1s during the first
# 3 updates (fast catch-up right after boot), then only slew afterwards.
makestep 1 3

driftfile /var/lib/chrony/drift
rtcsync
