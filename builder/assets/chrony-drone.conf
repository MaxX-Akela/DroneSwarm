# chrony config for the drone (client role).
#
# No "server" line on purpose: the drone client finds the show server by
# broadcast discovery and adds it as a chrony source at runtime
# (see drone/modules/network.py set_chrony_server), so no IP is configured here.

# Step the clock immediately if it's off by more than 1s during the first
# 3 updates (fast catch-up right after boot), then only slew afterwards.
makestep 1 3

driftfile /var/lib/chrony/drift
rtcsync
