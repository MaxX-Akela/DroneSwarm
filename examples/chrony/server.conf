# chrony config for the show server (time authority role).
#
# The show network is usually isolated/offline, so the server doesn't sync
# to anything upstream — it just declares itself stratum 10 and serves that
# time to the drones. "allow" with no argument accepts any client, so the
# subnet does not have to be configured.
local stratum 10
allow

driftfile /var/lib/chrony/drift
rtcsync
